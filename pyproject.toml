[project]
name = "pliris-ba-bot"
version = "0.1.0"
description = "A domain-restricted agentic RAG assistant for Business Analysis and Project Management practices."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Dumebi Nkwo" }
]
dependencies = [
    "fastapi[standard]==0.139.0",
    "httpx==0.28.1",
    "openai==2.45.0",
    "psycopg[binary,pool]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pymupdf==1.28.0",
    "python-dotenv==1.2.2",
    "rank-bm25==0.2.2",
    "streamlit==1.59.2",
    "supabase==2.31.0",
    "tenacity==9.1.4",
    "tiktoken==0.13.0",
]

[project.optional-dependencies]
ingestion = [
    "pymupdf==1.28.0",
    "pyyaml==6.0.3",
    "tiktoken==0.13.0",
]
reranking = [
    "sentence-transformers==5.6.0",
]
ui = [
    "pandas==3.0.3",
    "streamlit==1.59.2",
]
evaluation = [
    "pandas==3.0.3",
    "tqdm==4.68.4",
]
dev = [
    "mypy==1.20.2",
    "pytest==9.0.3",
    "pytest-cov==6.3.0",
    "ruff==0.15.21",
]

[tool.uv]
default-groups = ["dev"]
link-mode = "copy"

[dependency-groups]
dev = [
    "httpx2==2.7.0",
    "mypy==1.20.2",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.3.0",
    "ruff==0.15.21",
]
evaluation = [
    "sentence-transformers==5.6.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that call hosted services and require a configured .env file",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
